const DISTRICTS = ['全部', '浦东新区', '徐汇区', '长宁区', '静安区', '黄浦区', '虹口区', '杨浦区', '闵行区', '普陀区', '嘉定区', '宝山区'];

// ===================== 逻辑 =====================
let map = null;
let markers = [];
let mapLoaded = false;
let currentFilter = { type: 'all', district: '全部', keyword: '' };

const TYPE_MAP = {
  indoor: { label: '室内', class: 'tag-indoor' },
  outdoor: { label: '室外', class: 'tag-outdoor' },
  both: { label: '室内外', class: 'tag-both' }
};

document.addEventListener('DOMContentLoaded', () => {
  initFilters();
  initSearch();
  renderCourtList();
  updateStats();
  initMap();
});

function initMap() {
  const loadingEl = document.getElementById('loadingOverlay');
  const loadingText = loadingEl.querySelector('.loading-text');

  if (typeof AMap === 'undefined') {
    loadingText.textContent = '高德地图脚本加载失败，请检查网络连接';
    showMapFallback('高德地图脚本未能加载，请检查网络是否可访问 https://webapi.amap.com');
    return;
  }

  try {
    map = new AMap.Map('map', {
      zoom: 11,
      center: [121.4737, 31.2304],
      viewMode: '2D',
      mapStyle: 'amap://styles/normal',
      resizeEnable: true
    });

    mapLoaded = true;

    AMap.plugin(['AMap.ToolBar', 'AMap.Scale'], () => {
      map.addControl(new AMap.ToolBar({ position: 'LB', offset: [10, 60] }));
      map.addControl(new AMap.Scale());
    });

    createMarkers();
    setTimeout(() => loadingEl.classList.add('hidden'), 600);
  } catch (err) {
    console.error('地图初始化失败:', err);
    loadingText.textContent = '地图初始化失败';
    showMapFallback('地图初始化失败: ' + err.message);
  }
}

function showMapFallback(message) {
  document.getElementById('map').innerHTML = `
    <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); color: #2e7d32; text-align: center; padding: 40px;">
      <div style="font-size: 64px; margin-bottom: 16px;">🎾</div>
      <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">地图暂时不可用</div>
      <div style="font-size: 13px; color: #555; max-width: 400px; line-height: 1.6;">
        ${message}<br><br>
        请使用左侧列表浏览球场信息。<br>
        提示：地图需要通过 HTTP 服务器访问（而非直接双击打开）。
      </div>
      <div style="margin-top: 20px; font-size: 12px; color: #777;">
        终端运行: <code style="background:#fff; padding:4px 8px; border-radius:4px;">python3 -m http.server 8080</code><br>
        然后访问: <code style="background:#fff; padding:4px 8px; border-radius:4px;">http://localhost:8080</code>
      </div>
    </div>`;
}

function createMarkers() {
  if (!map || !mapLoaded) return;
  map.clearMap();
  markers = [];
  const filtered = getFilteredCourts();

  filtered.forEach(court => {
    const typeInfo = TYPE_MAP[court.type];
    const markerContent = document.createElement('div');
    markerContent.innerHTML = `<div style="width:32px;height:32px;border-radius:50%;background:${getTypeColor(court.type)};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid #fff;cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">🎾</div>`;

    const marker = new AMap.Marker({
      position: [court.lng, court.lat],
      content: markerContent,
      offset: new AMap.Pixel(-16, -32),
      title: court.name,
      extData: { id: court.id }
    });

    marker.on('click', () => { showCourtModal(court); highlightCourtCard(court.id); });

    const infoWindow = new AMap.InfoWindow({
      content: `<div class="info-window-content"><div class="info-window-title">${court.name}</div><div class="info-window-addr">📍 ${court.address}</div><div class="info-window-meta"><span class="tag ${typeInfo.class}" style="display:inline-block;margin-right:6px;">${typeInfo.label}</span><span>🏟️ ${court.courtCount}片</span></div></div>`,
      offset: new AMap.Pixel(0, -36)
    });

    marker.on('mouseover', () => infoWindow.open(map, marker.getPosition()));
    marker.on('mouseout', () => infoWindow.close());

    map.add(marker);
    markers.push(marker);
  });

  if (markers.length > 0) {
    map.setFitView(markers, false, [60, 60, 60, 60], 11);
  }
}

function getTypeColor(type) {
  return { indoor: '#2e7d32', outdoor: '#1565c0', both: '#e65100' }[type] || '#666';
}

function getFilteredCourts() {
  return TENNIS_COURTS.filter(court => {
    if (currentFilter.type !== 'all') {
      if (currentFilter.type === 'indoor' && court.type !== 'indoor' && court.type !== 'both') return false;
      if (currentFilter.type === 'outdoor' && court.type !== 'outdoor' && court.type !== 'both') return false;
    }
    if (currentFilter.district !== '全部' && court.district !== currentFilter.district) return false;
    if (currentFilter.keyword) {
      const kw = currentFilter.keyword.toLowerCase();
      if (!court.name.toLowerCase().includes(kw) && !court.address.toLowerCase().includes(kw) && !court.district.includes(kw)) return false;
    }
    return true;
  });
}

function renderCourtList() {
  const listEl = document.getElementById('courtList');
  const courts = getFilteredCourts();
  if (courts.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到符合条件的球场</p><p style="font-size:12px;margin-top:6px;">请尝试调整筛选条件</p></div>`;
    return;
  }
  listEl.innerHTML = courts.map(court => {
    const typeInfo = TYPE_MAP[court.type];
    return `<div class="court-card" data-id="${court.id}" onclick="onCourtCardClick(${court.id})"><div class="court-card-header"><div class="court-name">${court.name}</div><div class="court-tags"><span class="tag ${typeInfo.class}">${typeInfo.label}</span></div></div><div class="court-address"><span>📍</span> ${court.address}</div><div class="court-meta"><span>🏟️ ${court.courtCount}片场地</span><span class="court-price">💰 ${court.price.split('；')[0]}</span></div></div>`;
  }).join('');
}

function onCourtCardClick(id) {
  const court = TENNIS_COURTS.find(c => c.id === id);
  if (!court) return;
  highlightCourtCard(id);
  if (map && mapLoaded) map.setZoomAndCenter(15, [court.lng, court.lat]);
  showCourtModal(court);
}

function highlightCourtCard(id) {
  document.querySelectorAll('.court-card').forEach(card => {
    card.classList.toggle('active', parseInt(card.dataset.id) === id);
  });
}

function showCourtModal(court) {
  const typeInfo = TYPE_MAP[court.type];
  const modal = document.getElementById('infoModal');
  const overlay = document.getElementById('modalOverlay');

  const photoHtml = court.photo
    ? `<img class="modal-photo" src="${court.photo}" alt="${court.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="photo-placeholder" style="display:none;position:absolute;top:0;left:0;right:0;height:220px;"><div class="ph-icon">🎾</div><div class="ph-text">${court.name}</div></div>`
    : `<div class="photo-placeholder" style="height:220px;"><div class="ph-icon">🎾</div><div class="ph-text">${court.name}</div></div>`;

  const qrUrl = court.bookingUrl || `tel:${court.phone.replace(/-/g, '')}`;
  const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(qrUrl)}`;
  const isTel = qrUrl.startsWith('tel:');
  const isWeb = qrUrl.startsWith('http');

  let qrDesc = '', actionBtn = '';
  if (isTel) {
    qrDesc = '手机扫描可直接拨打预约电话，或点击下方按钮直接呼叫。';
    actionBtn = `<a href="${qrUrl}" class="phone-btn">📞 拨打 ${court.phone}</a>`;
  } else if (isWeb) {
    qrDesc = '手机扫描可跳转至预定页面，或复制链接后在浏览器中打开。';
    actionBtn = `<a href="${qrUrl}" target="_blank" class="phone-btn" style="background:#1565c0;">🔗 打开预定页面</a>`;
  } else {
    qrDesc = '请使用手机扫描，或按提示方式进行预定。';
    actionBtn = `<a href="tel:${court.phone.replace(/-/g, '')}" class="phone-btn">📞 拨打 ${court.phone}</a>`;
  }

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <div style="position:relative;">${photoHtml}</div>
    <div class="modal-body">
      <div class="modal-header-row"><div class="modal-title">${court.name}</div><div class="modal-tags"><span class="tag ${typeInfo.class}">${typeInfo.label}</span></div></div>
      <div class="modal-info-grid">
        <div class="info-row"><span class="label">📍 地址</span><span class="value">${court.address}</span></div>
        <div class="info-row"><span class="label">🏟️ 场地</span><span class="value">${court.courtCount}片${typeInfo.label}场地</span></div>
        <div class="info-row"><span class="label">💰 价格</span><span class="value" style="color:#e65100;font-weight:500;">${court.price}</span></div>
        <div class="info-row"><span class="label">🕐 时间</span><span class="value">${court.hours}</span></div>
        <div class="info-row full-width"><span class="label">📞 电话</span><span class="value">${court.phone}</span></div>
        <div class="info-row full-width"><span class="label">📋 渠道</span><span class="value">${court.bookingChannel}</span></div>
        ${court.bookingTips ? `<div class="info-row full-width"><span class="label">💡 提示</span><span class="value" style="color:#666;font-style:italic;">${court.bookingTips}</span></div>` : ''}
      </div>
      <div class="qrcode-section">
        <h4>📱 扫码预定</h4>
        <div class="qrcode-box">
          <img class="qrcode-img" src="${qrApiUrl}" alt="预定二维码" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Crect fill=%22%23f5f5f5%22 width=%22140%22 height=%22140%22/%3E%3Ctext x=%2270%22 y=%2275%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2212%22%3E二维码加载失败%3C/text%3E%3C/svg%3E'">
          <div class="qrcode-info">
            <div class="channel-name">${court.bookingChannel.split('/')[0].trim()}</div>
            <div class="channel-desc">${qrDesc}</div>
            ${actionBtn}
          </div>
        </div>
        <div class="qrcode-tips">⚠️ 以上价格为参考价，实际价格请以场馆公示或电话咨询为准。建议订场前电话确认最新价格和空场情况。</div>
      </div>
    </div>`;
  overlay.classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.querySelectorAll('.court-card').forEach(card => card.classList.remove('active'));
}

function onOverlayClick(e) { if (e.target === e.currentTarget) closeModal(); }

function initFilters() {
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter.type = btn.dataset.type;
      refresh();
    });
  });

  const districtContainer = document.getElementById('districtFilter');
  districtContainer.innerHTML = DISTRICTS.map(d => `<span class="district-chip ${d === '全部' ? 'active' : ''}" data-district="${d}">${d}</span>`).join('');
  districtContainer.querySelectorAll('.district-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      districtContainer.querySelectorAll('.district-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter.district = chip.dataset.district;
      refresh();
    });
  });
}

function initSearch() {
  const searchInput = document.getElementById('searchInput');
  let debounceTimer;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { currentFilter.keyword = e.target.value.trim(); refresh(); }, 300);
  });
}

function refresh() { renderCourtList(); createMarkers(); updateStats(); }

function updateStats() {
  const courts = getFilteredCourts();
  document.getElementById('statTotal').textContent = courts.length;
  document.getElementById('statIndoor').textContent = courts.filter(c => c.type === 'indoor' || c.type === 'both').length;
  document.getElementById('statOutdoor').textContent = courts.filter(c => c.type === 'outdoor' || c.type === 'both').length;
}

function zoomIn() { if (map && mapLoaded) map.zoomIn(); }
function zoomOut() { if (map && mapLoaded) map.zoomOut(); }
function resetView() { if (map && mapLoaded) map.setZoomAndCenter(11, [121.4737, 31.2304]); }

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
