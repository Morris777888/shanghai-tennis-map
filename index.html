<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上海网球场地图 - 在线订场指南</title>
  <meta name="description" content="上海网球场地图，标注全市室内室外网球场，含地址、价格、场地数量及预定渠道二维码">

  <script>
    window._AMapSecurityConfig = {
      securityJsCode: '3cf726fbd89834d80db1749343614cac'
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=b3dfb24d1081ea513b3f3f8a62089e44"></script>

  <style>

    :root {
      --bg-primary: #F5F5F0;
      --bg-secondary: #FAFAF8;
      --bg-card: #FFFFFF;
      --text-primary: #2D3436;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --accent-primary: #6B8E7D;
      --accent-secondary: #8FA3B5;
      --accent-warm: #BC978C;
      --border-light: #E8E8E4;
      --border-medium: #D8D8D4;
      --tag-indoor: #A8C5B8;
      --tag-outdoor: #9CB8C8;
      --tag-both: #D4C4A8;
      --tag-unconfirmed: #C4B5D4;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-container { display: flex; height: 100vh; width: 100vw; }

    .sidebar {
      width: 400px;
      min-width: 400px;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      z-index: 10;
      border-radius: 0 var(--radius-xl) var(--radius-xl) 0;
    }

    .sidebar-header {
      padding: 28px 24px 22px;
      background: linear-gradient(145deg, #6B8E7D 0%, #7A9D8C 100%);
      color: #fff;
      border-radius: 0 var(--radius-xl) var(--radius-lg) var(--radius-lg);
    }

    .sidebar-header h1 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .sidebar-header h1 .icon { font-size: 26px; }

    .stats-bar {
      display: flex;
      gap: 20px;
      font-size: 13px;
      opacity: 0.92;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.18);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      backdrop-filter: blur(8px);
    }

    .stat-item .num { font-size: 17px; font-weight: 700; }

    .filter-section {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-secondary);
    }

    .search-box { position: relative; margin-bottom: 14px; }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      font-size: 14px;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .search-box input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(107, 142, 125, 0.12);
    }

    .search-box input::placeholder { color: var(--text-tertiary); }

    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 15px;
    }

    .type-filters { display: flex; gap: 8px; margin-bottom: 12px; }

    .type-btn {
      flex: 1;
      padding: 9px 0;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .type-btn:hover {
      border-color: var(--accent-secondary);
      color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .type-btn.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    .district-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 76px;
      overflow-y: auto;
    }

    .district-filter::-webkit-scrollbar { width: 3px; }
    .district-filter::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

    .district-chip {
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-light);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .district-chip:hover { border-color: var(--accent-secondary); color: var(--accent-primary); }

    .district-chip.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    .court-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px;
      background: var(--bg-secondary);
    }

    .court-list::-webkit-scrollbar { width: 5px; }
    .court-list::-webkit-scrollbar-track { background: transparent; }
    .court-list::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }

    .court-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .court-card:hover {
      border-color: var(--accent-secondary);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .court-card.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(107, 142, 125, 0.12);
    }

    .court-card.unconfirmed {
      border-left: 3px solid var(--tag-unconfirmed);
      background: linear-gradient(90deg, #FAF8FB 0%, #fff 100%);
    }

    .court-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

    .court-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      flex: 1;
    }

    .court-tags {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .tag-indoor { background: #E8F2EB; color: #5A7D6A; }
    .tag-outdoor { background: #E8EFF4; color: #5A7A8A; }
    .tag-both { background: #F2EBE0; color: #8A7A5A; }
    .tag-unconfirmed { background: #EDE8F2; color: #7A6A8A; }

    .court-address {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      line-height: 1.45;
    }

    .court-address .addr-icon { color: var(--accent-secondary); font-size: 12px; }

    .court-meta {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .court-meta span { display: flex; align-items: center; gap: 3px; }

    .court-price { color: var(--accent-warm); font-weight: 600; }

    .map-container { flex: 1; position: relative; background: var(--bg-secondary); }

    #map { width: 100%; height: 100%; border-radius: var(--radius-xl) 0 0 var(--radius-xl); }

    .map-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .map-control-btn {
      width: 38px;
      height: 38px;
      background: var(--bg-card);
      border: none;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      font-size: 17px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .map-control-btn:hover { background: var(--bg-secondary); transform: scale(1.05); }

    .info-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(45, 52, 54, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .info-modal-overlay.show { opacity: 1; visibility: visible; }

    .info-modal {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      width: 540px;
      max-width: 92vw;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.92) translateY(10px);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--shadow-lg);
    }

    .info-modal-overlay.show .info-modal { transform: scale(1) translateY(0); }

    .modal-photo-wrap {
      position: relative;
      width: 100%;
      height: 230px;
      background: linear-gradient(135deg, #E8E4E1 0%, #DDD8D3 100%);
      overflow: hidden;
    }

    .modal-photo { width: 100%; height: 100%; object-fit: cover; }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #E8E4E1 0%, #D8D4CF 100%);
      color: #8A8680;
      gap: 12px;
    }

    .photo-placeholder svg { width: 80px; height: 80px; opacity: 0.5; }

    .photo-placeholder .ph-text {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }

    .modal-body {
      padding: 22px 26px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

    .unconfirmed-banner {
      background: linear-gradient(135deg, #F3EDF7 0%, #EDE7F2 100%);
      color: #6B5B7B;
      padding: 12px 16px;
      font-size: 12px;
      text-align: center;
      border-radius: var(--radius-md);
      margin-bottom: 14px;
      line-height: 1.6;
      border: 1px solid #E0D8E8;
    }

    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 10px;
    }

    .modal-title { font-size: 19px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }

    .modal-tags { display: flex; gap: 6px; flex-shrink: 0; }

    .modal-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
      margin-bottom: 18px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 13px;
      line-height: 1.55;
    }

    .info-row .label {
      color: var(--text-tertiary);
      flex-shrink: 0;
      min-width: 54px;
      font-weight: 500;
    }

    .info-row .value { color: var(--text-primary); }

    .info-row .value.price { color: var(--accent-warm); font-weight: 600; }

    .info-row .value.unconfirmed { color: #9B7FAF; font-style: italic; }

    .info-row.full-width { grid-column: 1 / -1; }

    .qrcode-section {
      border-top: 1px dashed var(--border-light);
      padding-top: 18px;
      margin-top: 4px;
    }

    .qrcode-section h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qrcode-box {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 18px;
      border: 1px solid var(--border-light);
    }

    .qrcode-wrap {
      width: 140px;
      height: 140px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      background: #fff;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qrcode-wrap canvas, .qrcode-wrap table, .qrcode-wrap img {
      max-width: 100% !important;
      max-height: 100% !important;
    }

    .qrcode-info { flex: 1; }

    .qrcode-info .channel-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 7px;
    }

    .qrcode-info .channel-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .qrcode-info .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 16px;
      background: var(--accent-primary);
      color: #fff;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .qrcode-info .action-btn:hover {
      background: #5A7D6C;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .qrcode-info .action-btn.secondary { background: var(--accent-secondary); }

    .qrcode-tips {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 12px;
      font-style: italic;
      line-height: 1.55;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      color: #fff;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover { background: rgba(0,0,0,0.5); transform: rotate(90deg); }

    .info-window-content {
      padding: 12px 16px;
      min-width: 220px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    .info-window-title { font-size: 14px; font-weight: 600; margin-bottom: 7px; color: var(--text-primary); }

    .info-window-addr { font-size: 12px; color: var(--text-secondary); margin-bottom: 7px; line-height: 1.4; }

    .info-window-meta { font-size: 12px; color: var(--text-secondary); }

    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      gap: 18px;
    }

    .loading-overlay.hidden { display: none; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid var(--border-light);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: var(--text-secondary); font-size: 14px; font-weight: 500; }

    .sidebar-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border-light);
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      background: var(--bg-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 50px 24px;
      color: var(--text-tertiary);
    }

    .empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.5; }

    .empty-state p { font-size: 13px; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; min-width: auto; height: 46vh; min-height: 320px; border-radius: 0; }
      .sidebar-header { border-radius: 0; }
      .map-container { height: 54vh; }
      #map { border-radius: 0; }
      .info-modal { width: 94vw; max-height: 82vh; }
      .modal-info-grid { grid-template-columns: 1fr; }
      .qrcode-box { flex-direction: column; align-items: center; }
    }

  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">正在加载地图数据...</div>
  </div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1><span class="icon">🎾</span>上海网球场地图</h1>
        <div class="stats-bar">
          <div class="stat-item"><span>共</span><span class="num" id="statTotal">0</span><span>家</span></div>
          <div class="stat-item"><span>室内</span><span class="num" id="statIndoor">0</span></div>
          <div class="stat-item"><span>室外</span><span class="num" id="statOutdoor">0</span></div>
        </div>
      </div>

      <div class="filter-section">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="搜索球场名称、地址...">
        </div>
        <div class="type-filters">
          <button class="type-btn active" data-type="all">全部</button>
          <button class="type-btn" data-type="indoor">室内</button>
          <button class="type-btn" data-type="outdoor">室外</button>
        </div>
        <div class="district-filter" id="districtFilter"></div>
      </div>

      <div class="court-list" id="courtList"></div>

      <div class="sidebar-footer">
        价格为参考价，请以场馆实际公示为准 · 照片为示意图片
      </div>
    </aside>

    <div class="map-container">
      <div id="map"></div>
      <div class="map-controls">
        <button class="map-control-btn" onclick="zoomIn()" title="放大">+</button>
        <button class="map-control-btn" onclick="zoomOut()" title="缩小">−</button>
        <button class="map-control-btn" onclick="resetView()" title="重置视角">🏠</button>
      </div>
    </div>
  </div>

  <div class="info-modal-overlay" id="modalOverlay" onclick="onOverlayClick(event)">
    <div class="info-modal" id="infoModal"></div>

  { id: 99, name: "智胜网球俱乐部", address: "闵行区金都路", district: "闵行区", type: "both", courtCount: 3, price: "约122元/人", phone: "待确认", bookingChannel: "大众点评 / 电话预约", bookingUrl: "https://m.dianping.com/shop/search?keyword=智胜网球", bookingTips: "2片室内+室外场地，场地间距大", hours: "08:00-22:00", lng: 121.41, lat: 31.095, unconfirmed: true },
  { id: 100, name: "Our Tennis网球俱乐部(车墩店)", address: "松江区车墩影视城附近", district: "松江区", type: "outdoor", courtCount: 3, price: "价格待确认", phone: "待确认", bookingChannel: "大众点评 / 电话预约", bookingUrl: "https://m.dianping.com/shop/search?keyword=Our+Tennis+车墩", bookingTips: "粉色+绿色多巴胺配色室外场", hours: "08:00-20:00", lng: 121.32, lat: 30.92, unconfirmed: true }
];

const DISTRICTS = ["全部", "浦东新区", "徐汇区", "长宁区", "静安区", "黄浦区", "虹口区", "杨浦区", "闵行区", "普陀区", "嘉定区", "宝山区", "松江区", "青浦区", "奉贤区"];

let map = null, markers = [], mapLoaded = false;
let currentFilter = { type: 'all', district: '全部', keyword: '' };

const TYPE_MAP = {
  indoor: { label: '室内', class: 'tag-indoor' },
  outdoor: { label: '室外', class: 'tag-outdoor' },
  both: { label: '室内外', class: 'tag-both' }
};

// SVG placeholder for court photos
const SVG_PLACEHOLDER = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" fill="url(#courtGrad)" rx="20"/>
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E4E1"/>
      <stop offset="100%" style="stop-color:#D8D4CF"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="28" fill="none" stroke="#A8A098" stroke-width="2.5"/>
  <path d="M32 60h56M60 32v56" stroke="#A8A098" stroke-width="2.5" fill="none"/>
  <ellipse cx="60" cy="60" rx="10" ry="8" fill="#BC978C" opacity="0.8"/>
  <path d="M42 42c-4 4-6 10-6 18s2 14 6 18" stroke="#8A8680" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M78 42c4 4 6 10 6 18s-2 14-6 18" stroke="#8A8680" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;

document.addEventListener('DOMContentLoaded', () => {
  initFilters();
  initSearch();
  renderCourtList();
  updateStats();
  initMap();
});

function initMap() {
  const loadingEl = document.getElementById('loadingOverlay');
  const loadingText = loadingEl.querySelector('.loading-text');
  if (typeof AMap === 'undefined') {
    loadingText.textContent = '高德地图脚本加载失败';
    showMapFallback('请检查网络是否可访问高德地图');
    return;
  }
  try {
    map = new AMap.Map('map', {
      zoom: 11, center: [121.4737, 31.2304], viewMode: '2D',
      mapStyle: 'amap://styles/normal', resizeEnable: true
    });
    mapLoaded = true;
    AMap.plugin(['AMap.ToolBar', 'AMap.Scale'], () => {
      map.addControl(new AMap.ToolBar({ position: 'LB', offset: [10, 60] }));
      map.addControl(new AMap.Scale());
    });
    createMarkers();
    setTimeout(() => loadingEl.classList.add('hidden'), 600);
  } catch (err) {
    loadingText.textContent = '地图初始化失败';
    showMapFallback(err.message);
  }
}

function showMapFallback(msg) {
  document.getElementById('map').innerHTML = `
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#F5F5F0 0%,#E8E4E1 100%);color:#6B7280;text-align:center;padding:40px;">
      <div style="font-size:64px;margin-bottom:16px;">🎾</div>
      <div style="font-size:18px;font-weight:600;margin-bottom:8px;color:#2D3436;">地图暂时不可用</div>
      <div style="font-size:13px;max-width:400px;line-height:1.6;">${msg}<br><br>请使用左侧列表浏览球场信息。</div>
    </div>`;
}

// 生成球场示意图片（零外部请求，纯前端 SVG data URI）
function getCourtPhoto(court) {
  return court.photo || null;
}

function getTypeColor(type, unconfirmed) {
  if (unconfirmed) return '#9B7FAF';
  return { indoor: '#6B8E7D', outdoor: '#7C9CB5', both: '#BC978C' }[type] || '#888';
}

function createMarkers() {
  if (!map || !mapLoaded) return;
  map.clearMap();
  markers = [];
  const filtered = getFilteredCourts();
  filtered.forEach(court => {
    const typeInfo = TYPE_MAP[court.type];
    const isUnconfirmed = court.unconfirmed;
    const bgColor = getTypeColor(court.type, isUnconfirmed);
    const icon = isUnconfirmed ? '❓' : '🎾';
    const borderStyle = isUnconfirmed ? '2px dashed #9B7FAF' : '2px solid #fff';
    const markerContent = document.createElement('div');
    markerContent.innerHTML = `<div style="width:32px;height:32px;border-radius:50%;background:${bgColor};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.25);border:${borderStyle};cursor:pointer;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.15)'" onmouseout="this.style.transform='scale(1)'">${icon}</div>`;
    const marker = new AMap.Marker({
      position: [court.lng, court.lat], content: markerContent,
      offset: new AMap.Pixel(-16, -32), title: court.name, extData: { id: court.id }
    });
    marker.on('click', () => { showCourtModal(court); highlightCourtCard(court.id); });
    const infoWindow = new AMap.InfoWindow({
      content: `<div class="info-window-content"><div class="info-window-title">${court.name}</div><div class="info-window-addr">${court.address}</div><div class="info-window-meta"><span class="tag ${typeInfo.class}" style="display:inline-block;margin-right:6px;">${typeInfo.label}</span><span>🏟️ ${court.courtCount}片</span>${isUnconfirmed ? '<span style="margin-left:6px;color:#9B7FAF;">🔍待确认</span>' : ''}</div></div>`,
      offset: new AMap.Pixel(0, -36)
    });
    marker.on('mouseover', () => infoWindow.open(map, marker.getPosition()));
    marker.on('mouseout', () => infoWindow.close());
    map.add(marker);
    markers.push(marker);
  });
  if (markers.length > 0) map.setFitView(markers, false, [60,60,60,60], 11);
}

function getFilteredCourts() {
  return TENNIS_COURTS.filter(court => {
    if (currentFilter.type !== 'all') {
      if (currentFilter.type === 'indoor' && court.type !== 'indoor' && court.type !== 'both') return false;
      if (currentFilter.type === 'outdoor' && court.type !== 'outdoor' && court.type !== 'both') return false;
    }
    if (currentFilter.district !== '全部' && court.district !== currentFilter.district) return false;
    if (currentFilter.keyword) {
      const kw = currentFilter.keyword.toLowerCase();
      if (!court.name.toLowerCase().includes(kw) && !court.address.toLowerCase().includes(kw) && !court.district.includes(kw)) return false;
    }
    return true;
  });
}

function renderCourtList() {
  const listEl = document.getElementById('courtList');
  const courts = getFilteredCourts();
  if (courts.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到符合条件的球场</p><p style="font-size:12px;margin-top:6px;">请尝试调整筛选条件</p></div>`;
    return;
  }
  listEl.innerHTML = courts.map(court => {
    const typeInfo = TYPE_MAP[court.type];
    const unconfirmedTag = court.unconfirmed ? `<span class="tag tag-unconfirmed">🔍待确认</span>` : '';
    const addrDisplay = court.address === '地址待确认' ? `<span style="color:#9B7FAF;font-style:italic;"><span class="addr-icon">📍</span> 地址待确认</span>` : `<span class="addr-icon">📍</span> ${court.address}`;
    const priceDisplay = court.price.includes('待确认') ? `<span style="color:#9B7FAF;">💰 价格待确认</span>` : `<span class="court-price">💰 ${court.price.split('；')[0]}</span>`;
    return `<div class="court-card ${court.unconfirmed ? 'unconfirmed' : ''}" data-id="${court.id}" onclick="onCourtCardClick(${court.id})"><div class="court-card-header"><div class="court-name">${court.name}</div><div class="court-tags"><span class="tag ${typeInfo.class}">${typeInfo.label}</span>${unconfirmedTag}</div></div><div class="court-address">${addrDisplay}</div><div class="court-meta"><span>🏟️ ${court.courtCount}片场地</span>${priceDisplay}</div></div>`;
  }).join('');
}

function onCourtCardClick(id) {
  const court = TENNIS_COURTS.find(c => c.id === id);
  if (!court) return;
  highlightCourtCard(id);
  if (map && mapLoaded) map.setZoomAndCenter(15, [court.lng, court.lat]);
  showCourtModal(court);
}

function highlightCourtCard(id) {
  document.querySelectorAll('.court-card').forEach(card => {
    card.classList.toggle('active', parseInt(card.dataset.id) === id);
  });
}

function showCourtModal(court) {
  const typeInfo = TYPE_MAP[court.type];
  const modal = document.getElementById('infoModal');
  const overlay = document.getElementById('modalOverlay');
  const isUnconfirmed = court.unconfirmed;
  const unconfirmedBanner = isUnconfirmed ? `<div class="unconfirmed-banner">🔍 该球场信息来源于网络搜索，部分信息（电话/价格/地址）待确认，建议通过大众点评搜索核实最新信息</div>` : '';

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-photo-wrap">
      ${court.photo ? `<img class="modal-photo" src="${court.photo}" alt="${court.name}" onerror="this.style.display='none'; this.parentElement.querySelector('.photo-placeholder').style.display='flex';">` : ''}
      <div class="photo-placeholder" style="${court.photo ? 'display:none;position:absolute;top:0;left:0;right:0;bottom:0;' : ''}">
        ${SVG_PLACEHOLDER}
        <div class="ph-text">${court.name}</div>
      </div>
    </div>
    <div class="modal-body">
      ${unconfirmedBanner}
      <div class="modal-header-row">
        <div class="modal-title">${court.name}</div>
        <div class="modal-tags">
          <span class="tag ${typeInfo.class}">${typeInfo.label}</span>
          ${isUnconfirmed ? '<span class="tag tag-unconfirmed">🔍待确认</span>' : ''}
        </div>
      </div>
      <div class="modal-info-grid">
        <div class="info-row"><span class="label">📍 地址</span><span class="value ${court.address === '地址待确认' ? 'unconfirmed' : ''}">${court.address}</span></div>
        <div class="info-row"><span class="label">🏟️ 场地</span><span class="value">${court.courtCount}片${typeInfo.label}场地</span></div>
        <div class="info-row"><span class="label">💰 价格</span><span class="value price ${court.price.includes('待确认') ? 'unconfirmed' : ''}">${court.price}</span></div>
        <div class="info-row"><span class="label">🕐 时间</span><span class="value">${court.hours}</span></div>
        <div class="info-row full-width"><span class="label">📞 电话</span><span class="value ${court.phone === '待确认' ? 'unconfirmed' : ''}">${court.phone}</span></div>
        <div class="info-row full-width"><span class="label">📋 渠道</span><span class="value">${court.bookingChannel}</span></div>
        ${court.bookingTips ? `<div class="info-row full-width"><span class="label">💡 提示</span><span class="value" style="color:#6B7280;font-style:italic;">${court.bookingTips}</span></div>` : ''}
      </div>
      <div class="qrcode-section">
        <h4>📱 扫码预定</h4>
        <div class="qrcode-box">
          <div class="qrcode-wrap" id="qrcodeWrap"></div>
          <div class="qrcode-info">
            <div class="channel-name">${court.bookingChannel.split('/')[0].trim()}</div>
            <div class="channel-desc">使用手机扫描上方二维码，或点击下方按钮进行预定。微信/支付宝均可扫描。</div>
            ${getActionButton(court)}
          </div>
        </div>
        <div class="qrcode-tips">以上价格为参考价，实际价格请以场馆公示或电话咨询为准。建议订场前电话确认最新价格和空场情况。</div>
      </div>
    </div>
  `;

  overlay.classList.add('show');

  // Generate QR code locally
  const qrUrl = court.bookingUrl || `tel:${court.phone.replace(/-/g, '')}`;
  setTimeout(() => {
    const wrap = document.getElementById('qrcodeWrap');
    if (wrap && typeof QRCode !== 'undefined') {
      try {
        new QRCode(wrap, {
          text: qrUrl, width: 128, height: 128,
          colorDark: '#2D3436', colorLight: '#FFFFFF',
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (e) {
        wrap.innerHTML = '<div style="font-size:11px;color:#9B7FAF;text-align:center;padding:8px;">二维码<br>生成失败</div>';
      }
    } else if (wrap) {
      wrap.innerHTML = '<div style="font-size:11px;color:#9B7FAF;text-align:center;padding:8px;">二维码<br>加载中</div>';
    }
  }, 50);
}

function getActionButton(court) {
  const qrUrl = court.bookingUrl || `tel:${court.phone.replace(/-/g, '')}`;
  if (qrUrl.startsWith('tel:')) {
    return `<a href="${qrUrl}" class="action-btn">📞 拨打 ${court.phone}</a>`;
  } else if (qrUrl.startsWith('http')) {
    return `<a href="${qrUrl}" target="_blank" class="action-btn secondary">🔗 打开预定页面</a>`;
  }
  return `<a href="tel:${court.phone.replace(/-/g, '')}" class="action-btn">📞 拨打 ${court.phone}</a>`;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.querySelectorAll('.court-card').forEach(card => card.classList.remove('active'));
}

function onOverlayClick(e) { if (e.target === e.currentTarget) closeModal(); }

function initFilters() {
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter.type = btn.dataset.type;
      refresh();
    });
  });
  const districtContainer = document.getElementById('districtFilter');
  districtContainer.innerHTML = DISTRICTS.map(d => `<span class="district-chip ${d === '全部' ? 'active' : ''}" data-district="${d}">${d}</span>`).join('');
  districtContainer.querySelectorAll('.district-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      districtContainer.querySelectorAll('.district-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter.district = chip.dataset.district;
      refresh();
    });
  });
}

function initSearch() {
  const searchInput = document.getElementById('searchInput');
  let debounceTimer;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { currentFilter.keyword = e.target.value.trim(); refresh(); }, 300);
  });
}

function refresh() { renderCourtList(); createMarkers(); updateStats(); }

function updateStats() {
  const courts = getFilteredCourts();
  document.getElementById('statTotal').textContent = courts.length;
  document.getElementById('statIndoor').textContent = courts.filter(c => c.type === 'indoor' || c.type === 'both').length;
  document.getElementById('statOutdoor').textContent = courts.filter(c => c.type === 'outdoor' || c.type === 'both').length;
}

function zoomIn() { if (map && mapLoaded) map.zoomIn(); }
function zoomOut() { if (map && mapLoaded) map.zoomOut(); }
function resetView() { if (map && mapLoaded) map.setZoomAndCenter(11, [121.4737, 31.2304]); }

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  </script>
</body>
